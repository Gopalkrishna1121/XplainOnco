[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xplainonco"
version = "0.1.0"
description = "Graph-conditioned soft decision trees and cross-modal attribution for explainable cancer subtyping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pandas>=2.1",
  "networkx>=3.2", "xgboost>=2.0", "pcst_fast>=1.0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
